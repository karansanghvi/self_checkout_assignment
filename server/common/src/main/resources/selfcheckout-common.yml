# Settings every service shares, shipped inside the common jar.
#
# Each service pulls this in with
#     spring.config.import: classpath:selfcheckout-common.yml
# and then sets only what is its own: name, port, database, pool size. Keep
# the two sets of keys disjoint -- an imported file overrides the one
# importing it, so a service cannot override anything defined here. That is
# why there is no datasource here any more: in week 4 all five services
# pointed at one database from this file; now each names its own.

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.school.selfcheckout: INFO
