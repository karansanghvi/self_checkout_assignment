# Message broker for the scan feed (checkout-service outbox -> analytics-service).
#
# Single-node Kafka in KRaft mode: no ZooKeeper, one container acting as both
# broker and controller. That is enough for a single-machine load test; the
# point is the decoupling, not broker redundancy.
#
#   ./scripts/kafka-up.sh      # starts this and creates the topic
#   ./scripts/kafka-down.sh
#
# PostgreSQL stays on the host (Homebrew), as in earlier weeks, so the
# database numbers remain comparable from week to week.
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: selfcheckout-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly by kafka-up.sh, so a typo in a topic
      # name fails loudly instead of silently creating a second topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 2s
      timeout: 10s
      retries: 30
