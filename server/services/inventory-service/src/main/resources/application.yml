spring:
  application:
    name: inventory-service
  config:
    import: classpath:selfcheckout-common.yml

  # inventory_db is this service's alone; no other service has credentials for it.
  datasource:
    # reWriteBatchedInserts: the audit rows of a whole batch of completions
    # go to Postgres as a few multi-row INSERTs rather than one per row.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${INVENTORY_DB_NAME:inventory_db}?reWriteBatchedInserts=true
    username: ${INVENTORY_DB_USER:inventory_svc}
    password: ${SERVICE_DB_PASSWORD}
    hikari:
      # Stock is written by one consumer thread, in batches; the rest of the
      # pool serves GET /inventory/low-stock.
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: inventory-service-pool

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8083}

app:
  low-stock-threshold: 50
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
