spring:
  application:
    name: inventory-service
  config:
    import: classpath:selfcheckout-common.yml

  # inventory_db is this service's alone; no other service has credentials for it.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${INVENTORY_DB_NAME:inventory_db}
    username: ${INVENTORY_DB_USER:inventory_svc}
    password: ${SERVICE_DB_PASSWORD}
    hikari:
      # Every completing basket's decrements now run here, so this pool
      # carries what checkout-service's did for /complete in week 4.
      maximum-pool-size: ${DB_POOL_SIZE:16}
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: inventory-service-pool

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8083}

app:
  low-stock-threshold: 50
  catalog-url: ${CATALOG_URL:http://localhost:8081}
