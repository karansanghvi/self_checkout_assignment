spring:
  application:
    name: checkout-service
  config:
    import: classpath:selfcheckout-common.yml

  # checkout_db is this service's alone; no other service has credentials for it.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${CHECKOUT_DB_NAME:checkout_db}
    username: ${CHECKOUT_DB_USER:checkout_svc}
    password: ${SERVICE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: checkout-service-pool

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8082}

app:
  catalog-url: ${CATALOG_URL:http://localhost:8081}

  # Step 2 of the completion saga. Worst case per request:
  # 3 attempts x 3s read timeout + 100ms + 200ms backoff, comfortably under
  # recovery.stale-after-ms, so the sweeper never races a live request.
  inventory:
    url: ${INVENTORY_URL:http://localhost:8083}
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
    max-attempts: 3
    backoff-ms: 100

  recovery:
    interval-ms: 5000
    stale-after-ms: 15000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    scan-topic: scan-events
