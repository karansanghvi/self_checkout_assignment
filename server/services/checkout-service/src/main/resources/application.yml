spring:
  application:
    name: checkout-service
  config:
    import: classpath:selfcheckout-common.yml

  # checkout_db is this service's alone; no other service has credentials for it.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${CHECKOUT_DB_NAME:checkout_db}
    username: ${CHECKOUT_DB_USER:checkout_svc}
    password: ${SERVICE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: checkout-service-pool

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8082}

# checkout-service calls no other service. It publishes scans and
# completions through its outbox, and follows the catalog-snapshots topic.
app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
