spring:
  application:
    name: admin-service
  config:
    import: classpath:selfcheckout-common.yml

server:
  port: ${SERVER_PORT:8085}

# admin-service owns no data and has no database. A reset is one event on
# reset-requested, then a wait for every participant's ack on reset-completed;
# see ResetService.
app:
  catalog-size: 2000
  stock-per-item: 10000
  reset:
    timeout-ms: 30000
    participants: catalog-service,inventory-service,checkout-service,analytics-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
