<text x="40" y="196" font-size="13" font-weight="700" fill="#0f172a">How to read it</text>
<line x1="40" y1="218" x2="40" y2="244" stroke="#334155" stroke-width="2" marker-end="url(#mh)"/><circle cx="40" cy="218" r="2.5" fill="#334155"/>
<text x="54" y="236" font-size="12" fill="#334155">down into a topic: publishes</text>
<line x1="40" y1="284" x2="40" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#mh)"/><circle cx="40" cy="284" r="3.5" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="54" y="276" font-size="12" fill="#334155">up from a topic: consumes</text>
<line x1="40" y1="302" x2="66" y2="302" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mh)"/>
<text x="74" y="306" font-size="12" fill="#334155">HTTP (public API only)</text>
<text x="40" y="336" font-size="11.5" fill="#475569">Each database is reachable only by</text>
<text x="40" y="351" font-size="11.5" fill="#475569">its own service role.</text>
<text x="40" y="374" font-size="11.5" fill="#475569">Checkout writes each event to its outbox</text>
<text x="40" y="389" font-size="11.5" fill="#475569">in the same DB transaction as the change;</text>
<text x="40" y="404" font-size="11.5" fill="#475569">a relay publishes the outbox in order.</text>
<text x="40" y="851" font-size="13" font-weight="700" fill="#0f172a">The three flows</text>
<rect x="40" y="863" width="10" height="10" fill="#2563eb"/>
<text x="58" y="873" font-size="12" fill="#334155">Scan: checkout adds the unit and a ScanRecorded event in one statement; analytics consumes the events into the 1000-scan hopping window.</text>
<rect x="40" y="883" width="10" height="10" fill="#15803d"/>
<text x="58" y="893" font-size="12" fill="#334155">Complete: checkout marks the basket COMPLETED and writes TransactionCompleted, then answers 200; inventory applies batches idempotently, offset saved with the stock.</text>
<rect x="40" y="903" width="10" height="10" fill="#c2410c"/>
<text x="58" y="913" font-size="12" fill="#334155">Reset: admin publishes ResetRequested; catalog reseeds and publishes a snapshot; inventory, checkout and analytics reset on it; all four ack on reset-completed.</text>
</svg>
