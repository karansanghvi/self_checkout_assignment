<rect width="1300" height="940" fill="#ffffff"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Self-checkout, week 6: event-driven microservices</text>
<text x="40" y="66" font-size="14" fill="#475569">Every service-to-service interaction is a Kafka event. HTTP is used only between the load client, the gateway, and the service that owns each public endpoint.</text>
<rect x="40" y="96" width="210" height="58" rx="8" fill="#f1f5f9" stroke="#475569"/>
<text x="145" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Load client</text>
<text x="145" y="140" font-size="12" text-anchor="middle" fill="#475569">10 or 100 stations</text>
<rect x="292" y="96" width="976" height="58" rx="8" fill="#f1f5f9" stroke="#475569"/>
<text x="780" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">API gateway :8080</text>
<text x="780" y="140" font-size="12" text-anchor="middle" fill="#475569">Spring Cloud Gateway MVC: routes public paths only, no /internal/** (none exists)</text>
<line x1="250" y1="125" x2="290" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#mh)"/>
<text x="270" y="117" font-size="10" text-anchor="middle" fill="#475569">HTTP</text>
