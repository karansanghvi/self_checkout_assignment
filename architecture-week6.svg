<text x="980" y="243" font-size="12" text-anchor="middle" fill="#475569">:8084</text>
<text x="980" y="261" font-size="11" text-anchor="middle" fill="#475569">GET /analytics/popular-items</text>
<line x1="944" y1="274" x2="944" y2="300" stroke="#0f172a" stroke-width="1.5"/>
<path d="M908,308 v44 a36,8 0 0 0 72,0 v-44" fill="#fefce8" stroke="#854d0e" stroke-width="1.3"/>
<ellipse cx="944" cy="308" rx="36" ry="8" fill="#fef9c3" stroke="#854d0e" stroke-width="1.3"/>
<text x="944" y="334" font-size="10.5" text-anchor="middle" fill="#713f12">analytics_db</text>
<line x1="1180" y1="154" x2="1180" y2="198" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mh)"/>
<rect x="1092.0" y="200" width="176" height="74" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="1180" y="224" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">admin-service</text>
<text x="1180" y="243" font-size="12" text-anchor="middle" fill="#475569">:8085</text>
<text x="1180" y="261" font-size="11" text-anchor="middle" fill="#475569">POST /admin/reset</text>
<text x="1144" y="330" font-size="11" text-anchor="middle" fill="#64748b" font-style="italic">stateless,</text>
<text x="1144" y="345" font-size="11" text-anchor="middle" fill="#64748b" font-style="italic">no database</text>
<rect x="30" y="418" width="1240" height="401" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="48" y="444" font-size="15" font-weight="700" fill="#0f172a">Kafka 3.9 broker</text>
<text x="48" y="462" font-size="11" fill="#475569">KRaft, single node, Docker. 1 partition per topic</text>
<line x1="48" y1="505" x2="1252" y2="505" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<text x="48" y="497" font-size="12.5" font-weight="700" fill="#2563eb">scan-events</text>
<line x1="48" y1="561" x2="1252" y2="561" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
<text x="48" y="553" font-size="12.5" font-weight="700" fill="#15803d">transaction-completed</text>
<line x1="48" y1="617" x2="1252" y2="617" stroke="#6b7280" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
<text x="48" y="609" font-size="12.5" font-weight="700" fill="#6b7280">transaction-completed.DLT</text>
<line x1="48" y1="673" x2="1252" y2="673" stroke="#7e22ce" stroke-width="3" stroke-linecap="round"/>
<text x="48" y="665" font-size="12.5" font-weight="700" fill="#7e22ce">catalog-snapshots (compacted)</text>
<line x1="48" y1="729" x2="1252" y2="729" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
<text x="48" y="721" font-size="12.5" font-weight="700" fill="#c2410c">reset-requested</text>
<line x1="48" y1="785" x2="1252" y2="785" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<text x="48" y="777" font-size="12.5" font-weight="700" fill="#b91c1c">reset-completed</text>
